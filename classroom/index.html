<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the AI: a classroom game by AI Asli</title>
<meta name="description" content="A big-screen classroom game: spot AI-written text, weigh the evidence in image clues, and learn why detectors can be wrong.">
<style>
:root{--bg:#F4F6F8;--panel:#FFFFFF;--ink:#14202B;--muted:#55626F;--line:#D7DEE4;--a:#F2B33D;--b:#5BC0EB;--ok:#2E9E68;--bad:#D9573F;--accent:#9B8CFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1720;--panel:#18222E;--ink:#F3F6F9;--muted:#A7B3BF;--line:#2B3846;--ok:#4CC38A;--bad:#F2705B;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0F1720;--panel:#18222E;--ink:#F3F6F9;--muted:#A7B3BF;--line:#2B3846;--ok:#4CC38A;--bad:#F2705B;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:clamp(16px,1.6vw,22px)/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid var(--a);outline-offset:3px}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1500px;margin:0 auto;padding:clamp(12px,2vw,28px)}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}header h1{margin:0;font-size:clamp(22px,2.6vw,38px);letter-spacing:-.01em}header .sub{color:var(--muted)}
.spacer{flex:1}.pill{padding:.3em .8em;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:.55em 1.1em;font-weight:700}.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#0D0A24}.btn.big{font-size:1.15em;padding:.7em 1.4em}
main{display:grid;align-content:center;gap:clamp(12px,2vw,24px);padding:clamp(10px,2vw,24px) 0}
.start{text-align:center;display:grid;gap:1rem;justify-items:center}.start h2{font-size:clamp(34px,5vw,72px);margin:.2em 0 0;line-height:1.05}.start p{max-width:46ch;color:var(--muted);margin:0 auto}
.modes{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}.mode{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:1em 1.2em;width:min(320px,90vw);text-align:left}.mode[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}.mode b{display:block;font-size:1.1em}.mode small{color:var(--muted)}
.q{font-size:clamp(24px,3.2vw,46px);font-weight:800;text-align:center;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(12px,2vw,24px)}
.card{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:clamp(16px,2vw,28px);display:grid;gap:.6em;align-content:start}
.card .tag{position:absolute;top:-.8em;left:1em;font-weight:800;font-size:1.1em;padding:.1em .7em;border-radius:10px;color:#111}.card.A .tag{background:var(--a)}.card.B .tag{background:var(--b)}
.card p.txt{margin:.4em 0 0;font-size:clamp(18px,2vw,30px);line-height:1.4}.card.win{border-color:var(--ok)}.card.lose{opacity:.75}
.card img{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#000}
.clue{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(16px,1.7vw,24px);background:color-mix(in srgb,var(--bg) 60%,var(--panel));border-radius:12px;padding:.8em 1em;white-space:pre-wrap;word-break:break-word}
.votes{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}.vote{display:flex;align-items:center;gap:.5em;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:.4em .5em .4em 1em;font-weight:700}
.vote .n{min-width:2.2em;text-align:center;font-size:1.2em}.vote button{width:2.2em;height:2.2em;border-radius:10px;border:0;background:color-mix(in srgb,var(--ink) 12%,transparent);font-weight:800}
.reveal{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(14px,2vw,26px);display:grid;gap:.5em}.reveal h3{margin:0;font-size:1.3em}.reveal .right{color:var(--ok)}.reveal .wrong{color:var(--bad)}
.meter{height:.6em;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--a),var(--bad))}
.hits{display:flex;flex-wrap:wrap;gap:.4em}.hits span{background:color-mix(in srgb,var(--bad) 22%,transparent);border-radius:8px;padding:.1em .5em;font-size:.9em}
mark{background:color-mix(in srgb,var(--bad) 35%,transparent);color:inherit;border-radius:4px;padding:0 .1em}
.discuss{color:var(--muted);font-style:italic}
footer{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85em}footer .fair{flex:1;min-width:260px}
.timer{font-variant-numeric:tabular-nums;font-weight:800}.timer.low{color:var(--bad)}
.builder{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:1.2em;display:grid;gap:.8em;text-align:left;max-width:900px;width:100%}
.builder textarea,.builder input,.builder select{width:100%;font:inherit;font-size:.9em;padding:.5em .7em;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.list{display:grid;gap:.4em;font-size:.9em}.list div{display:flex;gap:.6em;align-items:center;border-bottom:1px solid var(--line);padding:.3em 0}.list img{width:64px;height:44px;object-fit:cover;border-radius:6px}
.final{text-align:center;display:grid;gap:1rem;justify-items:center}.final .score{font-size:clamp(60px,10vw,140px);font-weight:900;line-height:1}
.small{font-size:.85em;color:var(--muted)}[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card,.reveal{animation:pop .25s ease}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Spot the AI</h1><span class="sub">a classroom game by AI Asli</span><span class="spacer"></span><span class="pill" id="progress">Ready</span><span class="pill" id="scorePill">Class score 0</span><button class="btn" id="timerBtn" aria-pressed="false" title="Turn the 30-second timer on or off">Timer off</button><button class="btn" id="fsBtn">Full screen</button></header>
  <main id="main"></main>
  <footer><span class="fair"><b>Remember:</b> AI detectors give estimates, not proof, and flag people writing in a second language more often. Use this game to learn the signs, never to accuse anyone.</span><span>Keys: <b>1</b>/<b>2</b>/<b>3</b>/<b>4</b> add a vote · <b>Space</b> reveal · <b>→</b> next</span></footer>
</div>
<script>
/* AI Asli detector.js, included so the game works on its own */
/* AI Asli detector: runs entirely in the browser. No text leaves the page.
   It scores writing for patterns common in AI-generated text. It is a likelihood
   estimate based on style, not proof: people write like this too.
   Fairness: style-based detectors are known to flag non-native English writers, and very formal or
   templated writing, more often than others (Liang et al., 2023, "GPT detectors are biased against
   non-native English writers", Patterns 4(7)). Scores must never be the sole basis for academic,
   employment or disciplinary decisions. Present them as a prompt for conversation, not a verdict. */
(() => {
  if (globalThis.SlopticalDetector) return;

  // Phrases that chat models overuse. Weight 1 = common tell, 2 = strong tell.
  const PHRASES = [
    ["delve", 2], ["delves", 2], ["delving", 2], ["tapestry", 2], ["testament to", 2], ["in today's fast-paced", 2], ["in today’s fast-paced", 2],
    ["ever-evolving", 2], ["ever-changing landscape", 2], ["navigate the complexities", 2], ["navigating the complexities", 2], ["unlock the power", 2],
    ["unleash the power", 2], ["harness the power", 2], ["it's important to note", 2], ["it’s important to note", 2], ["it is important to note", 2],
    ["it's worth noting", 1], ["it’s worth noting", 1], ["a myriad of", 2], ["plethora of", 1], ["in the realm of", 2], ["the realm of", 1],
    ["embark on a journey", 2], ["embark on", 1], ["game-changer", 1], ["game changer", 1], ["seamlessly", 1], ["seamless", 1], ["robust", 1],
    ["leverage", 1], ["leveraging", 1], ["elevate your", 2], ["elevate", 1], ["foster", 1], ["fostering", 1], ["pivotal", 1], ["paramount", 1],
    ["multifaceted", 2], ["nuanced", 1], ["intricate", 1], ["intricacies", 1], ["underscores", 1], ["underscore the", 1], ["showcasing", 1],
    ["boasts", 1], ["vibrant", 1], ["bustling", 1], ["meticulous", 1], ["meticulously", 1], ["comprehensive guide", 2], ["ultimate guide", 1],
    ["whether you're a", 2], ["whether you’re a", 2], ["look no further", 2], ["let's dive in", 2], ["let’s dive in", 2], ["dive into", 1],
    ["deep dive", 1], ["in conclusion", 1], ["in summary", 1], ["to sum up", 1], ["at the end of the day", 1], ["stands as", 1], ["serves as a", 1],
    ["plays a crucial role", 2], ["plays a vital role", 2], ["plays a pivotal role", 2], ["crucial role", 1], ["key role", 1], ["a crucial", 1],
    ["cutting-edge", 1], ["state-of-the-art", 1], ["revolutionize", 1], ["revolutionise", 1], ["transformative", 1], ["empower", 1], ["empowering", 1],
    ["holistic", 1], ["synergy", 1], ["streamline", 1], ["unparalleled", 1], ["resonate with", 1], ["resonates with", 1], ["navigate", 1],
    ["landscape", 1], ["journey", 1], ["realm", 1], ["beacon of", 2], ["symphony of", 2], ["treasure trove", 2], ["rich tapestry", 2],
    ["not only", 1], ["moreover", 1], ["furthermore", 1], ["additionally", 1], ["notably", 1], ["ultimately", 1],
    ["in essence", 1], ["essentially", 1], ["arguably", 1], ["indelible", 2], ["profound", 1], ["commendable", 1], ["noteworthy", 1],
    ["ever-evolving landscape", 2], ["at its core", 1], ["nestled", 1], ["unlock", 1], ["unleash", 1], ["in a world where", 1],
    ["in today's digital age", 2], ["in today’s digital age", 2], ["when it comes to", 1], ["sheds light on", 1], ["a wide range of", 1],
    ["it goes without saying", 1], ["at the forefront of", 2], ["paving the way", 1], ["cutting edge", 1], ["state of the art", 1],
    ["dive in", 1], ["embarking on", 1],
  ];
  // Things that usually mean text was pasted from a chatbot.
  const ARTIFACTS = [
    [/\bas an ai( language model)?\b/i, "Mentions being an AI language model"],
    [/\b(i hope this helps|hope this helps!?)\b/i, "Chatbot sign-off (“I hope this helps”)"],
    [/\b(certainly|absolutely|of course)! (here('|’)s|here is|below is)\b/i, "Chatbot opener (“Certainly! Here’s…”)"],
    [/\bgreat question\b/i, "Chatbot opener (“Great question”)"],
    [/\bi (can('|’)t|cannot) (browse|access) the internet\b/i, "Mentions a chatbot limitation"],
    [/\b(my|as of my) (last )?knowledge cut-?off\b/i, "Mentions a knowledge cutoff"],
    [/\[(insert|your|add) [^\]]{2,30}\]/i, "Unfilled template placeholder, like “[insert name]”"],
    [/\bregenerate (response|answer)\b/i, "Interface text from a chatbot"],
    [/\*\*[^*]{2,40}\*\*:/, "Leftover markdown bold labels (**Label**:)"],
    [/\bfeel free to (ask|reach out|let me know)\b/i, "Chatbot-style offer (“Feel free to ask”)"],
    [/(^|\n)\s*(certainly|of course|absolutely)!\s/i, "Chatbot opener (“Certainly!”)"],
    [/\blet me know if (you('|’)d like|there('|’)s anything else)\b/i, "Chatbot sign-off (“Let me know if you’d like…”)"],
    [/\b(happy|glad) to help\b/i, "Chatbot sign-off (“Happy to help”)"],
  ];
  const STARTERS = /^(moreover|furthermore|additionally|in addition|overall|ultimately|importantly|notably|in conclusion|in summary|consequently|thus|however),?\s/i;

  const words = t => t.match(/[A-Za-zÀ-ÿ'’-]+/g) || [];
  const sentences = t => t.replace(/\s+/g, " ").split(/(?<=[.!?])\s+(?=[A-Z0-9“"(])/).map(s => s.trim()).filter(s => s.split(" ").length >= 3);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const PH_RE = PHRASES.map(([p, w]) => [new RegExp(`\\b${esc(p)}\\b`, "gi"), w, p]);

  // Match every stock phrase with its character span, then keep the longest
  // match when spans overlap, so "in the realm of" is not also counted as
  // "the realm of" and "realm".
  function phraseHits(lower) {
    const spans = [];
    for (const [re, w, p] of PH_RE) {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(lower)) !== null) {
        spans.push({ start: m.index, end: m.index + m[0].length, w, p });
        if (m[0].length === 0) re.lastIndex++;
      }
    }
    spans.sort((a, b) => (b.end - b.start) - (a.end - a.start) || a.start - b.start);
    const kept = [];
    for (const s of spans) {
      if (kept.some(t => s.start < t.end && t.start < s.end)) continue;
      kept.push(s);
    }
    return kept;
  }

  function score(text) {
    const W = words(text), n = W.length, reasons = [], hits = [];
    if (n < 25) return { score: 0, words: n, reasons: [], hits: [], tooShort: true };
    const lower = text.toLowerCase(); let z = -2.6;

    // 1. Chatbot artefacts: nearly decisive.
    let art = 0; for (const [re, why] of ARTIFACTS) if (re.test(text)) { art++; reasons.push({ w: 3, text: why }); }
    z += Math.min(art, 2) * 3.2;

    // 2. Stock phrase density (overlapping spans counted once — see phraseHits).
    // Density is phrases per 100 words, and the denominator never drops
    // below 100: a single stock phrase in a 30-word passage is not the
    // same evidence as the same rate sustained across a long text.
    let pw = 0; const found = new Map();
    for (const s of phraseHits(lower)) { pw += s.w; found.set(s.p, (found.get(s.p) || 0) + 1); hits.push(s.p); }
    const density = pw / Math.max(n, 100) * 100;
    if (density > 0) {
      z += Math.min(density, 6) * .55;
      const list = [...found.keys()].slice(0, 5).map(p => `“${p}”`).join(", ");
      if (density >= 1.2) reasons.push({ w: Math.min(density, 6) * .55, text: `Many phrases chatbots overuse: ${list}` });
    }

    // 3. Uniform sentence lengths (low "burstiness").
    const S = sentences(text);
    if (S.length >= 4) {
      const L = S.map(s => s.split(/\s+/).length), mean = L.reduce((a, b) => a + b, 0) / L.length, sd = Math.sqrt(L.reduce((a, b) => a + (b - mean) ** 2, 0) / L.length), cv = sd / mean;
      if (cv < .32 && mean > 12) { const v = (.32 - cv) * 7; z += v; reasons.push({ w: v, text: "Sentences are all a similar length, a common sign of generated text" }); }
      if (cv > .65) z -= .6;
      const st = S.filter(s => STARTERS.test(s)).length / S.length;
      if (st >= .25) { const v = st * 2.4; z += v; reasons.push({ w: v, text: "Many sentences start with “Moreover”, “Furthermore” or similar" }); }
      const tri = S.filter(s => /\b\w+(?:\s\w+)?, \w+(?:\s\w+)?,? and \w+/i.test(s)).length / S.length;
      if (tri >= .4) { const v = tri * 1.6; z += v; reasons.push({ w: v, text: "Frequent lists of three (“X, Y and Z”)" }); }
    }

    // 4. Contrast templates and rhetorical set-ups.
    const tmpl = (text.match(/\b(it('|’)s|this is|that('|’)s) not (just |only |merely )?(about )?[^.,;]{2,40}[,;—–-]+\s*(it('|’)s|but)\b/gi) || []).length
      + (text.match(/\bnot (just|only|merely) [^.]{2,50}, but (also )?/gi) || []).length
      + (text.match(/(^|\. )(the result|the answer|the catch|the twist|the best part)\?\s/gi) || []).length;
    if (tmpl) { const v = Math.min(tmpl, 3) * .8; z += v; reasons.push({ w: v, text: "Template contrasts like “It’s not just X, it’s Y”" }); }

    // 5. Em dash density — em dashes, spaced en dashes and "--" all do the
    // same job in generated text; an unspaced en dash in "2020–2025" is a
    // range and is not counted. The density floor (Math.max(n, 100)) means
    // one or two dashes in a short piece do not move the score; it takes
    // sustained use.
    const dashCount = (text.match(/—/g) || []).length
      + (text.match(/ – /g) || []).length
      + (text.match(/--/g) || []).length;
    const dashes = dashCount / Math.max(n, 100) * 100;
    if (dashes > 1.2) { const v = Math.min(dashes, 4) * .35; z += v; reasons.push({ w: v, text: "Heavy use of em dashes (—) and spaced en dashes" }); }

    // 6. Hedged, balanced framing.
    const hedge = (lower.match(/\b(on the other hand|on one hand|it depends on|there are several|there are many|various factors|a variety of)\b/g) || []).length;
    if (hedge >= 2) { z += .6; reasons.push({ w: .6, text: "Evenly balanced, hedged framing (“On the other hand…”)" }); }

    // 7. Repetition: the same wordings and sentence openings come up again.
    // Quoted passages are stripped first, so a line quoted twice (common in
    // journalism) does not count as the writer repeating themselves. Straight
    // single quotes are NOT stripped: they are usually possessives. Only
    // mid-sentence 4-grams count, so names and titles that journalism
    // repeats ("Press Gazette", "the Supply Chainer") do not trigger it, and
    // it fires on the repetition *rate*: a long article naturally restates
    // its topic, so the signal needs several distinct repeats in a short span.
    const unquoted = text.replace(/"[^"]{2,200}"/g, " ").replace(/“[^”]{2,200}”/g, " ").replace(/‘[^’]{2,200}’/g, " ");
    const uwords = unquoted.match(/[A-Za-zÀ-ÿ'’-]+/g) || [];
    const seen4 = new Map();
    for (let i = 0; i + 4 <= uwords.length; i++) {
      const g = uwords.slice(i, i + 4);
      if (g.some(w => /^[A-ZÀ-Þ]/.test(w))) continue;
      const key = g.join(" ").toLowerCase();
      seen4.set(key, (seen4.get(key) || 0) + 1);
    }
    const repeats = [...seen4.values()].filter(c => c >= 2).length;
    if (repeats >= 3 && repeats / Math.max(n, 100) * 100 >= 1.5) { z += .5; reasons.push({ w: .5, text: "Repeated phrases — the same wordings come up again and again" }); }
    if (S.length >= 5) {
      const firsts = S.map(s => (s.replace(/^[^A-Za-z]+/, "").split(/\s+/)[0] || "").toLowerCase());
      const fc = new Map(); for (const f of firsts) fc.set(f, (fc.get(f) || 0) + 1);
      if (Math.max(...fc.values()) / S.length >= .4) { z += .5; reasons.push({ w: .5, text: "Most sentences start with the same word" }); }
    }

    // 8. Hedging density: modal hedges pile up in generated drafts.
    const hedges = (lower.match(/\b(may|might|could|possibly|perhaps|potentially)\b/g) || []).length + (lower.match(/\bin some cases\b/g) || []).length;
    if (hedges / Math.max(n, 100) * 100 >= 1.2) { z += .6; reasons.push({ w: .6, text: "Heavy hedging (“may”, “might”, “could”, “potentially”)" }); }

    // 9. Almost no contractions in a long text. Formal AI drafts rarely use
    // them — but journalism and academic writing often don't either, so this
    // is deliberately small.
    if (n >= 300) {
      const contr = (text.match(/\w+n't\b|\w+('re|'ve|'ll|'d|'m)\b|\b(it's|that's|there's|here's|what's|let's)\b/gi) || []).length;
      if (contr / n * 100 < .1) { z += .3; reasons.push({ w: .3, text: "Almost no contractions in a long text" }); }
    }

    // 10. Guide-style structural tells: headings that read like content-farm furniture.
    const struct = (text.match(/^(key takeaways|the bottom line|tl;dr|in summary|the ultimate guide to|everything you need to know about|what this means for you)\b/gim) || []).length;
    if (struct) { const v = Math.min(struct, 2) * .5; z += v; reasons.push({ w: v, text: "“Key takeaways” / guide-style headings" }); }

    // 11. Paragraph-length uniformity: the same burstiness idea as sentences.
    // The threshold is tight (CV under 0.20): edited journalism also runs to
    // fairly even paragraphs, so only near-identical lengths count.
    const paras = text.split(/\n\s*\n/).map(p => words(p).length).filter(l => l >= 5);
    if (paras.length >= 4) {
      const pm = paras.reduce((a, b) => a + b, 0) / paras.length, psd = Math.sqrt(paras.reduce((a, b) => a + (b - pm) ** 2, 0) / paras.length), pcv = psd / pm;
      if (pcv < .2 && pm > 40) { z += .5; reasons.push({ w: .5, text: "Paragraphs are all a similar length" }); }
    }

    // 12. Colon density: "Point: explanation" framing is a chatbot habit —
    // but colons are ordinary in lists, times and headings, so times and
    // URLs are stripped first and this only fires at a high density.
    const noTime = text.replace(/\b\d{1,2}:\d{2}\b/g, " ").replace(/:\/\//g, " ");
    const colonCount = (noTime.match(/:/g) || []).length;
    if (colonCount >= 4 && colonCount / Math.max(n, 100) * 100 >= 2) { z += .4; reasons.push({ w: .4, text: "Many colons framing points (“X: explanation”)" }); }

    // 13. Semicolon density: formal generated prose leans on them, but so
    // does educated human writing — so this is deliberately tiny and only
    // fires at a high density.
    const semiCount = (text.match(/;/g) || []).length;
    if (semiCount >= 4 && semiCount / Math.max(n, 100) * 100 >= 1.5) { z += .3; reasons.push({ w: .3, text: "Many semicolons in a short span" }); }

    // 14. Signs of a human: personal detail, typos, informal punctuation.
    const human = (text.match(/\b(i|my|we|our)\b/gi) || []).length / n * 100;
    if (human > 3 && !art) z -= .5;
    if (/(\?\?|!!|\.\.\.\s*[a-z]|\blol\b|\bimo\b|\btbh\b)/i.test(text)) z -= .8;
    if (/\b(teh|recieve|definately|seperate|alot)\b/i.test(text)) z -= .6;

    const p = Math.round(100 / (1 + Math.exp(-z)));
    reasons.sort((a, b) => b.w - a.w);
    return { score: Math.max(0, Math.min(99, p)), words: n, reasons: reasons.slice(0, 4).map(r => r.text), hits };
  }

  { clue: "Camera: Canon EOS R6\nLens: 24–70 mm, f/4, 1/250 s\nTaken: 14 March 2026, 10:42", answer: 2, why: "Camera details point to a real photo. But they can be copied into an AI image, so check other evidence too." },
  { clue: "Image exactly 1024 × 1024 pixels.\nCaption underneath: “made with an AI art tool”", answer: 0, why: "A typical generator size and a nearby AI label together make AI likely. Either one alone would be weak evidence." },
  { clue: "Content Credentials, signed by a news agency:\n“Captured with a camera. Edits: crop, brightness.”", answer: 2, why: "Signed Content Credentials record where an image came from. A valid signature from a trusted source is strong evidence." },
];
let S = { mode: "writing", custom: [], rounds: [], i: 0, score: 0, votes: [0, 0, 0, 0], revealed: false, timer: false, t: 0 };
let tick = 0;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildRounds() {
  if (S.mode === "writing") return shuffle(WRITING.map(w => { const aiFirst = Math.random() < .5; return { kind: "writing", w, aiSide: aiFirst ? 0 : 1, texts: aiFirst ? [w.ai, w.human] : [w.human, w.ai] }; }));
  if (S.mode === "clues") return shuffle(CLUES.map(c => ({ kind: "clue", c })));
  return shuffle(S.custom.map(x => ({ kind: x.type === "pair" ? "writing" : "picture", ...(x.type === "pair" ? (() => { const aiFirst = Math.random() < .5; return { w: { topic: x.topic || "Your round", human: x.human, ai: x.ai, src: x.src || "Added by the teacher", discuss: x.discuss || "" }, aiSide: aiFirst ? 0 : 1, texts: aiFirst ? [x.ai, x.human] : [x.human, x.ai] }; })() : { p: x }) })));
}
function render() { ({ start: renderStart, round: renderRound, final: renderFinal, build: renderBuilder })[S.screen || "start"](); $("#scorePill").textContent = `Class score ${S.score}`; }
function renderStart() {
  $("#progress").textContent = "Ready";
  $("#main").innerHTML = `<section class="start"><h2>Can you spot the AI?</h2><p>Look closely, vote as a class, then see what AI Asli noticed. Wrong answers are part of the lesson: these tools can be fooled, and so can we.</p>
    <div class="modes" role="group" aria-label="Choose a game">
      <button class="mode" data-m="writing" aria-pressed="${S.mode === "writing"}"><b>Writing rounds</b><small>Two passages. Which did AI write? AI Asli shows its clues.</small></button>
      <button class="mode" data-m="clues" aria-pressed="${S.mode === "clues"}"><b>Clue rounds</b><small>What does the evidence really tell us? Sometimes the answer is “Can’t tell”.</small></button>
      <button class="mode" data-m="custom" aria-pressed="${S.mode === "custom"}"><b>Your own rounds</b><small>${S.custom.length ? `${S.custom.length} round${S.custom.length > 1 ? "s" : ""} added` : "Add your own pictures or writing"}</small></button>
    </div>
    <div class="row" style="justify-content:center;flex:none"><button class="btn primary big" id="go">Start</button><button class="btn" id="build">Add your own rounds</button></div>
    <p class="small">Tip for the classroom: show this on a big screen. To use a Google Nest Hub or a TV with Google TV or Chromecast, open this page in Chrome and choose ⋮ → Cast → Cast tab.</p></section>`;
  $("#main").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { S.mode = b.dataset.m; render(); });
  $("#go").onclick = startGame; $("#build").onclick = () => { S.screen = "build"; render(); };
}
function startGame() { S.rounds = buildRounds(); if (!S.rounds.length) { S.screen = "build"; return render(); } S.i = 0; S.score = 0; S.screen = "round"; newRound(); }
function newRound() { S.votes = [0, 0, 0, 0]; S.revealed = false; S.t = 30; clearInterval(tick); if (S.timer) tick = setInterval(() => { S.t--; const el = $("#timer"); if (el) { el.textContent = `${S.t}s`; el.classList.toggle("low", S.t <= 5); } if (S.t <= 0) { clearInterval(tick); reveal(); } }, 1000); render(); }
const optsFor = r => r.kind === "clue" ? CLUE_OPTS : r.kind === "picture" ? ["AI-made", "Real photo", "Can’t tell"] : ["Passage A", "Passage B"];
const answerOf = r => r.kind === "clue" ? r.c.answer : r.kind === "picture" ? ({ ai: 0, real: 1, unsure: 2 }[r.p.truth]) : r.aiSide;
function renderRound() {
  const r = S.rounds[S.i], opts = optsFor(r); $("#progress").textContent = `Round ${S.i + 1} of ${S.rounds.length}`;
  let body = "";
  if (r.kind === "writing") body = `<p class="q">Which passage did AI write?</p><p class="small" style="text-align:center;margin:0">Topic: ${esc(r.w.topic)}</p><div class="cards">${r.texts.map((t, k) => `<article class="card ${"AB"[k]}${S.revealed ? (k === r.aiSide ? " win" : " lose") : ""}"><span class="tag">${"AB"[k]}</span><p class="txt">${S.revealed ? markHits(t) : esc(t)}</p></article>`).join("")}</div>`;
  if (r.kind === "clue") body = `<p class="q">What does this evidence tell us?</p><div class="cards"><article class="card"><div class="clue">${esc(r.c.clue)}</div></article></div>`;
  if (r.kind === "picture") body = `<p class="q">Real photo or made by AI?</p><div class="cards"><article class="card"><img src="${r.p.src}" alt="Picture for this round"></article></div>`;
  const votes = `<div class="votes">${opts.map((o, k) => `<div class="vote"><span>${k + 1}. ${esc(o)}</span><span class="n" aria-live="polite">${S.votes[k]}</span><button data-v="${k}" aria-label="Add a vote for ${esc(o)}">+</button></div>`).join("")}</div>`;
  const ctl = `<div class="row" style="justify-content:center;flex:none">${S.timer && !S.revealed ? `<span class="pill timer" id="timer">${S.t}s</span>` : ""}${S.revealed ? `<button class="btn primary big" id="next">${S.i < S.rounds.length - 1 ? "Next round →" : "See the results"}</button>` : `<button class="btn primary big" id="rev">Reveal</button>`}</div>`;
  $("#main").innerHTML = body + votes + (S.revealed ? revealHtml(r) : "") + ctl;
  $("#main").querySelectorAll("[data-v]").forEach(b => b.onclick = () => { S.votes[+b.dataset.v]++; b.previousElementSibling.textContent = S.votes[+b.dataset.v]; });
  $("#rev")?.addEventListener("click", reveal); $("#next")?.addEventListener("click", next);
}
function markHits(t) { let h = esc(t); const a = D.analyse(t); [...new Set(a.hits || [])].sort((x, y) => y.length - x.length).forEach(w => { const re = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/'/g, "['’]")})`, "gi"); h = h.replace(re, "<mark>$1</mark>"); }); return h; }
function revealHtml(r) {
  const ans = answerOf(r), total = S.votes.reduce((a, b) => a + b, 0), top = total ? S.votes.indexOf(Math.max(...S.votes)) : -1, right = top === ans;
  const verdict = total ? `<h3 class="${right ? "right" : "wrong"}">${right ? "The class got it!" : "Not this time."}</h3>` : `<h3>Answer</h3>`;
  if (r.kind === "writing") {
    const sc = r.texts.map(t => D.analyse(t));
    return `<section class="reveal">${verdict}<p><b>Passage ${"AB"[r.aiSide]}</b> was written by AI. The other is from ${esc(r.w.src)}.</p>
      ${sc.map((a, k) => `<div><b>AI Asli’s estimate for ${"AB"[k]}: ${a.score}%</b><div class="meter"><i style="width:${a.score}%"></i></div>${a.reasons?.length ? `<p class="small">${esc(a.reasons.slice(0, 2).join(" · "))}</p>` : `<p class="small">No strong AI patterns found.</p>`}</div>`).join("")}
      ${r.w.discuss ? `<p class="discuss">Talk about it: ${esc(r.w.discuss)}</p>` : ""}</section>`;
  }
  if (r.kind === "clue") return `<section class="reveal">${verdict}<p><b>Best answer: ${esc(CLUE_OPTS[ans])}.</b> ${esc(r.c.why)}</p></section>`;
  const j = r.p.check; return `<section class="reveal">${verdict}<p><b>Answer: ${esc(["AI-made", "Real photo", "Can’t tell"][ans])}.</b> ${esc(r.p.note || "")}</p>${j ? `<p class="small">AI Asli checked the file: ${j.p}% likely AI. ${esc((j.why || []).slice(0, 3).join(" · ") || "No evidence found in the file.")}</p>` : ""}</section>`;
}
function reveal() { if (S.revealed) return; clearInterval(tick); const r = S.rounds[S.i], total = S.votes.reduce((a, b) => a + b, 0); if (total && S.votes.indexOf(Math.max(...S.votes)) === answerOf(r)) S.score++; S.revealed = true; render(); }
function next() { if (S.i < S.rounds.length - 1) { S.i++; newRound(); } else { S.screen = "final"; clearInterval(tick); render(); } }
function renderFinal() {
  $("#progress").textContent = "Finished";
  $("#main").innerHTML = `<section class="final"><p class="q">Class score</p><div class="score">${S.score} / ${S.rounds.length}</div>
    <div class="reveal" style="max-width:900px;text-align:left"><h3>What did we learn?</h3><ul><li>AI writing often uses vague, grand words that could fit any topic, and tidy signposts like “Moreover” or “In conclusion”.</li><li>Evidence in files can help, but missing evidence proves nothing, and labels can be faked or removed.</li><li>Detectors, and people, make mistakes. Formal writing and people writing in a second language get wrongly flagged more often.</li></ul><p class="discuss">Talk about it: when would it be unfair to use a detector’s score to decide something about a person?</p></div>
    <div class="row" style="justify-content:center;flex:none"><button class="btn primary big" id="again">Play again</button><button class="btn" id="home">Choose another game</button></div></section>`;
  $("#again").onclick = startGame; $("#home").onclick = () => { S.screen = "start"; render(); };
}
/* ---------- teacher’s own rounds ---------- */
function renderBuilder() {
  $("#progress").textContent = "Your rounds";
  $("#main").innerHTML = `<section class="builder"><h2 style="margin:0">Add your own rounds</h2><p class="small" style="margin:0">Rounds stay on this device. Use pictures you have the right to show, and never use students’ work without their permission.</p>
    <h3 style="margin:.4em 0 0">Pictures</h3><div class="row"><input type="file" id="pics" accept="image/*" multiple aria-label="Choose pictures"><select id="truth" aria-label="What are these pictures?"><option value="ai">These are AI-made</option><option value="real">These are real photos</option><option value="unsure">We can’t be sure</option></select></div>
    <input id="note" placeholder="Optional note for the reveal, such as where the picture came from">
    <h3 style="margin:.4em 0 0">Writing</h3><div class="row"><textarea id="hum" rows="3" placeholder="Human-written passage"></textarea><textarea id="aiw" rows="3" placeholder="AI-written passage"></textarea></div>
    <div class="row"><input id="src" placeholder="Where the human passage comes from"><button class="btn" id="addPair">Add writing round</button></div>
    <div class="list" id="list">${S.custom.map((x, i) => `<div>${x.type === "pic" ? `<img src="${x.src}" alt="">` : "✎"}<span style="flex:1">${x.type === "pic" ? `${{ ai: "AI-made", real: "Real photo", unsure: "Can’t tell" }[x.truth]}${x.check ? `, AI Asli: ${x.check.p}%` : ""}` : esc(x.human.slice(0, 60)) + "…"}</span><button class="btn" data-del="${i}" aria-label="Remove round ${i + 1}">Remove</button></div>`).join("") || `<p class="small">No rounds yet.</p>`}</div>
    <div class="row" style="flex:none"><button class="btn primary" id="play" ${S.custom.length ? "" : "disabled"}>Play these rounds</button><button class="btn" id="exp" ${S.custom.length ? "" : "disabled"}>Save rounds to a file</button><label class="btn" style="flex:none">Open rounds<input type="file" id="imp" accept=".json" hidden></label><button class="btn" id="back">Back</button></div></section>`;
  $("#pics").onchange = async e => { for (const f of e.target.files) { const src = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }), buf = new Uint8Array(await f.arrayBuffer()); let check = null; try { const latin = new TextDecoder("latin1").decode(buf.slice(0, 4e6)), img = new Image(); img.src = src; await img.decode(); check = M.judge({ url: f.name, bytes: M.inspectBytes(latin), w: img.naturalWidth, h: img.naturalHeight }); check = { p: check.p ?? check.score, why: check.why || check.reasons || [] }; } catch {} S.custom.push({ type: "pic", src, truth: $("#truth").value, note: $("#note").value.trim(), check }); } renderBuilder(); };
  $("#addPair").onclick = () => { const h = $("#hum").value.trim(), a = $("#aiw").value.trim(); if (!h || !a) return alert("Add both passages first."); S.custom.push({ type: "pair", human: h, ai: a, src: $("#src").value.trim() }); renderBuilder(); };
  $("#list").onclick = e => { const b = e.target.closest("[data-del]"); if (b) { S.custom.splice(+b.dataset.del, 1); renderBuilder(); } };
  $("#play").onclick = () => { S.mode = "custom"; startGame(); }; $("#back").onclick = () => { S.screen = "start"; render(); };
  $("#exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ kind: "spot-the-ai-rounds", v: 1, rounds: S.custom })], { type: "application/json" })); a.download = "spot-the-ai-rounds.json"; a.click(); };
  $("#imp").onchange = async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (d.kind !== "spot-the-ai-rounds") throw 0; S.custom = d.rounds.filter(x => x && (x.type === "pic" ? /^data:image\//.test(x.src) : x.human && x.ai)); renderBuilder(); } catch { alert("That isn’t a Spot the AI rounds file."); } };
}
/* ---------- controls ---------- */
$("#fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
if (!document.documentElement.requestFullscreen) $("#fsBtn").hidden = true;
$("#timerBtn").onclick = () => { S.timer = !S.timer; $("#timerBtn").setAttribute("aria-pressed", String(S.timer)); $("#timerBtn").textContent = S.timer ? "Timer on" : "Timer off"; };
addEventListener("keydown", e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || S.screen !== "round") return; const r = S.rounds[S.i], n = optsFor(r).length;
  if (/^[1-4]$/.test(e.key) && +e.key <= n && !S.revealed) { S.votes[+e.key - 1]++; render(); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); S.revealed ? next() : reveal(); }
  else if (e.key === "ArrowRight" && S.revealed) next(); });
S.screen = "start"; render();
</script>
